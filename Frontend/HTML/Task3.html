<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notice Box</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
        }

        .notice-box {
            background-color: #fdf6e2;
            border: 1px solid #d3c2a3;
            border-radius: 4px;
            padding: 15px;
            width: 400px;
        }

        .notice-title {
            font-weight: bold;
            color: #333333;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .notice-message {
            color: #555555;
            font-size: 12px;
            margin: 0;
        }
    </style>
</head>

<body>

    <div class="notice-box">
        <div class="notice-title">Notice</div>
        <p class="notice-message">
            This is an important message for the user.
        </p>
    </div>

</body>
</html>
