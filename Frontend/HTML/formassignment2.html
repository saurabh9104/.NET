<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="submit.html" method="get">
        <h3>Employee Details</h3>

        <label for="first-name">First Name:</label>
        <input type="text" id="first-name" name="first-name" placeholder="Enter Name" pattern="^[a-zA-Z]{1,10}$" required>
        <br>

        <label for="last-name">Last Name:</label>
        <input type="text" id="last-name" name="last-name" placeholder="Enter Surname" pattern="^[a-zA-Z]{1,10}$" required>
        <br>

        <input type="radio" id="male" name="gender" value="male" required>Male
        <input type="radio" id="female" name="gender" value="female" required>Female
        <br>

        <label for="Employee ID">Employee ID:</label>
        <input type="text" id="Employee ID" name="Employee ID" placeholder="Enter EMPId" pattern="^[A-Za-z0-9]{1,10}$" required>
        <br>

        <label for="Designation">Designation:</label>
        <input type="text" id="Designation" name="Designation" pattern="^[a-zA-Z]{1,20}$" required>
        <br>

        <label for="Phone Number">Phone Number:</label>
        <input type="tel" id="Phone Number" name="Phone Number" pattern="[6-9][0-9]{9}" required>
        <br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
