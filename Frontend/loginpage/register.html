
<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

    <style>
        body {
            font-family: Arial;
        }

        .div2 {
            width: 300px;
            margin: 100px auto;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: green;
            color: white;
            border: none;
        }

        a {
            color: blue;
        }
    </style>
</head>

<body>

    <div class="div2">
        
        <h2>Register</h2>
        <form action="">

        <input type="text" id="name" name="name" placeholder="Enter your Name" pattern="^[a-zA-Z]{1,20}$" required>

        <input type="email" name="email" id="email" placeholder="Enter your Email" pattern="^[a-zA-Z0-9._%+-]+@gmail\.com$" required>

        <input type="password" name="password" id="password" placeholder="Enter your Password" required>

        <input type="password" name="confirm_password" id="confirm_password" placeholder="Confirm your Password" required>

        <button>Register</button>

        <p>
            Already have an account?
            <a href="login.html">Login</a>
        </p>
        </form>
    </div>

</body>
</html>
