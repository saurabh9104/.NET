
<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        body {
            font-family: Arial;

        }

        .div1 {
            width: 300px;
            margin: 100px auto;
            
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0 ;

        }

        button {
            width: 100%;
            padding: 10px;
            background-color: blue;
            color: white;
            border: none;
        }

        a {
            color: blue;
        }
    </style>
</head>

<body>

    <div class="div1">

        <h2>Login</h2>
        <form action="">
        <input type="email" name="email" id="email" placeholder="Enter your Email" pattern="^[a-zA-Z0-9._%+-]+@gmail\.com$" required>

        <input type="password" name="password" id="password" placeholder="Enter your Password" required>

            <button>Login</button>
        </form>

        <p>
            Don't have an account?
            <a href="register.html">Register</a>
        </p>

    </div>

</body>
</html>
